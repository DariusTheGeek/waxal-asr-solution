[pytest]
# Only tests/ is runnable from a clone. The suites under train/families/*/tests/
# are part of the verbatim training record: they expect the original training
# workspace (WAXAL3_REPO_ROOT and an experiments/ tree) and fail at collection
# without it, so they are excluded rather than left to error.
testpaths = tests
norecursedirs = train .venvs outputs weights data models/omniasr-* models/mms-*
