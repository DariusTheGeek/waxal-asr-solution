<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1064" role="img" aria-label="The five-stage Waxal pipeline">
<style>
.band { stroke: rgba(27,34,51,.14); stroke-dasharray: 2 7; fill: none; }
.band-label { font-family: ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size: 10.5px; font-weight: 600; letter-spacing: .14em; fill: #5B6478; }
.band-label.hot { fill: #A5680B; }
.node { fill: #F7F8FB; stroke: rgba(27,34,51,.14); }
.node-hot { fill: rgba(165,104,11,.08); stroke: #A5680B; stroke-width: 1.6; }
.node-ghost { fill: none; stroke: rgba(27,34,51,.5); stroke-dasharray: 5 5; }
.mbox { fill: #F7F8FB; stroke: rgba(27,34,51,.14); }
.t-title { font-family: system-ui,'Segoe UI',sans-serif; font-size: 15px; font-weight: 600; fill: #1B2233; }
.t-name  { font-family: system-ui,'Segoe UI',sans-serif; font-size: 13.5px; font-weight: 600; fill: #1B2233; }
.t-sub   { font-family: ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size: 11.5px; fill: #5B6478; }
.t-mode  { font-family: ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size: 11px; fill: #5B6478; }
.t-eyebrow { font-family: ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size: 10.5px; font-weight: 600; letter-spacing: .14em; }
.t-lin  { fill: #A5680B; }
.t-sna  { fill: #0E7A6B; }
.t-note { font-family: system-ui,'Segoe UI',sans-serif; font-size: 12.5px; font-style: italic; fill: #5B6478; }
.t-row  { font-family: system-ui,'Segoe UI',sans-serif; font-size: 12.5px; fill: #1B2233; }
.edge      { stroke: rgba(27,34,51,.5); stroke-width: 1.6; fill: none; }
.edge-lin  { stroke: #A5680B;  stroke-width: 1.8; fill: none; }
.edge-sna  { stroke: #0E7A6B;  stroke-width: 1.8; fill: none; }
.edge-dash { stroke-dasharray: 6 5; }
.lbl { font-family: ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size: 11.5px; fill: #5B6478; }
</style>
<rect x="1" y="1" width="1098" height="1062" rx="16" fill="#FFFFFF" stroke="rgba(27,34,51,.14)"/>


    <defs>
      <marker id="ar-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="rgba(27,34,51,.5)"/>
      </marker>
      <marker id="ar-l" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="#A5680B"/>
      </marker>
      <marker id="ar-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="#0E7A6B"/>
      </marker>
    </defs>

    <!-- stage bands -->
    <g>
      <line class="band" x1="196" y1="140" x2="1084" y2="140"/>
      <text class="band-label" x="16" y="144">STAGE 0 · ROUTE</text>
      <line class="band" x1="196" y1="304" x2="1084" y2="304"/>
      <text class="band-label" x="16" y="308">STAGE 1 · DECODE</text>
      <line class="band" x1="216" y1="590" x2="1084" y2="590"/>
      <text class="band-label hot" x="16" y="594">STAGE 2 · TTIA MATCH</text>
      <line class="band" x1="196" y1="750" x2="1084" y2="750"/>
      <text class="band-label" x="16" y="754">STAGE 3 · FUSE</text>
      <line class="band" x1="196" y1="940" x2="1084" y2="940"/>
      <text class="band-label" x="16" y="944">STAGE 4 · SUBMIT</text>
    </g>

    <!-- edges (drawn before nodes so boxes sit on top) -->
    <path class="edge" d="M610 92 V156" marker-end="url(#ar-n)"/>
    <path class="edge-lin" d="M610 258 C610 292 390 292 390 324" marker-end="url(#ar-l)"/>
    <path class="edge-sna" d="M610 258 C610 292 830 292 830 324" marker-end="url(#ar-s)"/>
    <path class="edge-lin edge-dash" d="M588 258 C300 278 150 356 150 470 V604" marker-end="url(#ar-l)"/>
    <path class="edge" d="M420 660 H368" marker-end="url(#ar-n)"/>
    <path class="edge-lin" d="M390 550 V758" marker-end="url(#ar-l)"/>
    <path class="edge-sna" d="M830 550 V758" marker-end="url(#ar-s)"/>
    <path class="edge-lin" d="M210 716 V736 H340 V758" marker-end="url(#ar-l)"/>
    <path class="edge-lin" d="M390 896 C390 932 540 926 540 952" marker-end="url(#ar-l)"/>
    <path class="edge-sna" d="M830 896 C830 932 680 926 680 952" marker-end="url(#ar-s)"/>

    <!-- edge labels -->
    <text class="lbl" x="622" y="126">decode every clip</text>
    <text class="lbl t-lin" x="374" y="298" text-anchor="end">447 · Lingala</text>
    <text class="lbl t-sna" x="846" y="298">445 · Shona</text>
    <text class="lbl t-lin" transform="rotate(-90 136 468)" x="136" y="468" text-anchor="middle">same 447 clips · raw audio</text>
    <text class="lbl" x="404" y="708">4 hypotheses</text>
    <text class="lbl" x="844" y="708">4 hypotheses</text>
    <text class="lbl t-lin" x="275" y="729" text-anchor="middle">profile key per clip</text>
    <text class="lbl" x="437" y="920" text-anchor="middle">447 rows</text>
    <text class="lbl" x="763" y="920" text-anchor="middle">445 rows</text>
    <text class="t-note" x="850" y="654">Shona passes straight through —</text>
    <text class="t-note" x="850" y="672">no stage 2 on this lane</text>

    <!-- source -->
    <rect class="node" x="460" y="28" width="300" height="64" rx="12"/>
    <text class="t-title" x="610" y="55" text-anchor="middle">892 evaluation clips</text>
    <text class="t-sub" x="610" y="76" text-anchor="middle">48 kHz audio · IDs only</text>

    <!-- stage 0 -->
    <rect class="node" x="380" y="162" width="460" height="96" rx="12"/>
    <text class="t-title" x="610" y="190" text-anchor="middle">Tag-free decode → text language ID</text>
    <text class="t-sub" x="610" y="212" text-anchor="middle">joint OmniASR CTC-1B — one bilingual model, no language token</text>
    <text class="t-sub" x="610" y="230" text-anchor="middle">char 3–5-gram TF-IDF + logistic regression on the decoded text</text>

    <!-- stage 1 · lingala stack -->
    <g class="m"><rect class="mbox" x="250" y="330" width="280" height="46" rx="9"/>
      <text class="t-name" x="266" y="358">OmniASR CTC-3B</text>
      <text class="t-mode" x="514" y="358" text-anchor="end">greedy</text></g>
    <g class="m"><rect class="mbox" x="250" y="388" width="280" height="46" rx="9"/>
      <text class="t-name" x="266" y="416">OmniASR LLM-3B</text>
      <text class="t-mode" x="514" y="416" text-anchor="end">beam 5 · len-norm</text></g>
    <g class="m"><rect class="mbox" x="250" y="446" width="280" height="46" rx="9"/>
      <text class="t-name" x="266" y="474">OmniASR LLM-1B</text>
      <text class="t-mode" x="514" y="474" text-anchor="end">beam 5 · len-norm</text></g>
    <g class="m"><rect class="mbox" x="250" y="504" width="280" height="46" rx="9"/>
      <text class="t-name" x="266" y="532">OmniASR CTC-1B</text>
      <text class="t-mode" x="514" y="532" text-anchor="end">greedy</text></g>

    <!-- stage 1 · shona stack -->
    <g class="m"><rect class="mbox" x="690" y="330" width="280" height="46" rx="9"/>
      <text class="t-name" x="706" y="358">OmniASR LLM-3B</text>
      <text class="t-mode" x="954" y="358" text-anchor="end">beam 5 · len-norm</text></g>
    <g class="m"><rect class="mbox" x="690" y="388" width="280" height="46" rx="9"/>
      <text class="t-name" x="706" y="416">OmniASR LLM-1B</text>
      <text class="t-mode" x="954" y="416" text-anchor="end">beam 5 · len-norm</text></g>
    <g class="m"><rect class="mbox" x="690" y="446" width="280" height="46" rx="9"/>
      <text class="t-name" x="706" y="474">OmniASR CTC-7B ×3</text>
      <text class="t-mode" x="954" y="474" text-anchor="end">greedy ×3</text></g>
    <g class="m"><rect class="mbox" x="690" y="504" width="280" height="46" rx="9"/>
      <text class="t-name" x="706" y="532">MMS-1B</text>
      <text class="t-mode" x="954" y="532" text-anchor="end">greedy</text></g>

    <!-- stage 2 · ttia -->
    <rect class="node node-hot" x="60" y="612" width="300" height="104" rx="12"/>
    <text class="t-eyebrow t-lin" x="210" y="638" text-anchor="middle">TEST-TIME IDIOLECT ADAPTATION</text>
    <text class="t-title" x="210" y="662" text-anchor="middle">Match the voice → pick a profile</text>
    <text class="t-sub" x="210" y="683" text-anchor="middle">MMS-1B voice vectors · layers 4 + 8</text>
    <text class="t-sub" x="210" y="700" text-anchor="middle">LDA → cosine → cohort norm</text>

    <rect class="node node-ghost" x="420" y="620" width="200" height="80" rx="12"/>
    <text class="t-name" x="520" y="646" text-anchor="middle">Enrolment gallery</text>
    <text class="t-sub" x="520" y="666" text-anchor="middle">21,566 clips · 84 profiles</text>
    <text class="t-mode" x="520" y="684" text-anchor="middle">training + pool audio</text>

    <!-- stage 3 · fusions -->
    <rect class="node" x="230" y="762" width="320" height="134" rx="12"/>
    <text class="t-eyebrow t-lin" x="390" y="788" text-anchor="middle">TTIA FUSION</text>
    <text class="t-row" x="390" y="812" text-anchor="middle">boundary-norm every hypothesis to the profile</text>
    <text class="t-row" x="390" y="832" text-anchor="middle">add the conservative word-ROVER candidate</text>
    <text class="t-row" x="390" y="852" text-anchor="middle">profile LM picks the lowest-cost candidate</text>

    <rect class="node" x="670" y="762" width="320" height="134" rx="12"/>
    <text class="t-eyebrow t-sna" x="830" y="788" text-anchor="middle">WORD-MEDOID MBR</text>
    <text class="t-row" x="830" y="812" text-anchor="middle">CTC-7B trio → ROVER → one hypothesis</text>
    <text class="t-row" x="830" y="832" text-anchor="middle">lowest mean peer-WER wins, taken whole</text>
    <text class="t-row" x="830" y="852" text-anchor="middle">fixed member order breaks ties</text>

    <!-- stage 4 -->
    <rect class="node" x="410" y="956" width="400" height="82" rx="12"/>
    <text class="t-title" x="610" y="985" text-anchor="middle">NFC normalise → submission.csv</text>
    <text class="t-sub" x="610" y="1007" text-anchor="middle">892 rows</text>
    <text class="t-mode" x="610" y="1025" text-anchor="middle">fusion and write are deterministic</text>
  </svg>
